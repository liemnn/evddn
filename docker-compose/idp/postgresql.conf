# ============================================
# POSTGRESQL 17 CONFIGURATION FOR ODOO 19
# System: 8 vCPUs / 16GB RAM
# ============================================

# ---- Kết nối & Mạng ----
listen_addresses = '*'
port = 5432
max_connections = 200               # Phù hợp với Odoo (9 workers) + background jobs

# Chỉ định file phân quyền HBA (Chuẩn cho Docker mount)
hba_file = '/etc/postgresql/pg_hba.conf'

# ---- Tối ưu bộ nhớ (Memory) ----
shared_buffers = 4GB                # 25% tổng RAM (16GB)
work_mem = 16MB                     # Bộ nhớ cho mỗi phép sort/join (tránh tràn RAM khi max_connections cao)
maintenance_work_mem = 512MB        # Bộ nhớ cho VACUUM, CREATE INDEX
effective_cache_size = 10GB         # Uớc tính RAM dành cho OS + Postgres Caching (~65% RAM)

# ---- Song song hóa (Parallel Query Optimization cho 8 CPUs) ----
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4
max_parallel_workers = 8

# ---- WAL & Checkpoint (Tối ưu I/O Ghi đĩa) ----
wal_level = replica
wal_buffers = 16MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
min_wal_size = 1GB
max_wal_size = 4GB

# ---- Query Planner (Tối ưu cho ổ đĩa SSD/NVMe) ----
random_page_cost = 1.1              # Đặt 1.1 nếu dùng SSD/NVMe (mặc định 4.0 cho HDD)
effective_io_concurrency = 200

# ---- Autovacuum (Tránh phình dữ liệu / Bloat DB) ----
autovacuum = on
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_max_workers = 4

# ---- Nhật ký hệ thống (Logging) ----
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 500   # Ghi log các truy vấn chậm hơn 500ms
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'Asia/Ho_Chi_Minh'
timezone = 'Asia/Ho_Chi_Minh'

# ---- Ngôn ngữ & Định dạng ----
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'