[options]
; ---- Cấu hình Database (Đồng bộ với Docker Compose) ----
db_host = db
db_port = 5432
db_user = idp
db_password = IDP@123!@#
db_name = idp
db_maxconn = 128

lang = vi_VI
timezone = Asia/Ho_Chi_Minh

; ---- Đường dẫn Addons & Data ----
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

; ---- Quản trị Master Password (Cần bảo mật) ----
admin_passwd = IDP_MasterAdmin@2026!

; ---- Tối ưu hóa đa luồng (Dành cho Server 8 CPU / 16GB RAM) ----
workers = 9
max_cron_threads = 2

; Ẩn danh sách database ở trang đăng nhập (Tăng bảo mật)
list_db = False

; Bật Reverse Proxy Mode (Bắt buộc khi chạy sau Nginx)
proxy_mode = True

; ---- Đồng bộ Timeout với Nginx (Chống ngắt kết nối khi tác vụ nặng) ----
limit_time_cpu = 3600
limit_time_real = 3600

; ---- Giới hạn RAM cho Worker (Tối ưu cho tổng 16GB RAM) ----
; Soft limit: ~1.25 GB / worker
limit_memory_soft = 1342177280
; Hard limit: ~1.50 GB / worker
limit_memory_hard = 1610612736