worker_processes auto;

events {
    worker_connections 4096;   # Tăng để chịu tải cao hơn
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    ## Giới hạn header/URL
    client_header_buffer_size 16k;
    large_client_header_buffers 4 32k;

    ## Gzip config
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_buffers 16 8k;
    gzip_min_length 256;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/json
        application/ld+json
        image/svg+xml
        font/woff
        font/woff2
        application/font-woff
        application/font-woff2;

    ## Upstreams
    upstream odoo {
        server odoo:8069;
    }
    upstream odoochat {
        server odoo:8072;
    }

    ## HTTP Server (Main)
    server {
        listen 80;
        listen [::]:80;
        server_name _;  # Nhận mọi domain/IP hoặc đổi thành IP/domain cụ thể của bạn

        ## Security headers (Chuẩn hóa cho HTTP)
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer-when-downgrade;

        ## Proxy timeout & body size
        proxy_read_timeout    3600;
        proxy_connect_timeout 3600;
        proxy_send_timeout    3600;
        client_max_body_size  200M;

        ## Proxy buffering
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
        proxy_temp_file_write_size 32k;

        ## Cache Static Files (Giảm tải cho Odoo bằng Browser Cache)
        location ~* /web/static/ {
            proxy_buffering on;
            expires 864000;
            proxy_pass http://odoo;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        ## Odoo main application
        location / {
            proxy_pass http://odoo;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        ## Odoo chat & notifications (Websocket / Longpolling)
        location /websocket {
            proxy_pass http://odoochat;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        ## Logging
        access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log warn;
    }
}